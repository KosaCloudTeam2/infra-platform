# Terraform apply 이후 출력값으로 치환
# - haproxy-a/c ansible_host: terraform output haproxy_public_ips 값
# - relay-01 ansible_host: terraform output relay_eip 값(경로 B 사용 시)
#
# 주의: 이 inventory는 SSH로 접근 가능한 Public IP 기준 예시임.
# HAProxy EC2를 Private Subnet + SSM으로 운영할 경우 Ansible SSM connection 설정을 별도로 사용함.

[haproxy]
haproxy-a ansible_host=REPLACE_HAPROXY_A_PUBLIC_IP
haproxy-c ansible_host=REPLACE_HAPROXY_C_PUBLIC_IP

[haproxy:vars]
# terraform.tfvars(onprem_edge_backends)와 동일하게 유지
onprem_edge_backends=["172.16.22.10:443","172.16.22.11:443"]

[relay]
relay-01 ansible_host=REPLACE_RELAY_EIP

[relay:vars]
wg_interface=wg0
wg_address=10.200.0.1/24
wg_listen_port=51820

# terraform.tfvars(onprem_cidr)와 동일하게 유지
onprem_cidr=172.16.0.0/12
onprem_allowed_ips=10.200.0.2/32,172.16.0.0/12

# 민감값: 저장소 평문 금지(Ansible Vault 또는 실행시 -e 권장)
onprem_public_key=REPLACE_ONPREM_PUBLIC_KEY
relay_private_key=REPLACE_RELAY_PRIVATE_KEY

[all:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/kp-haproxy-edge.pem
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
