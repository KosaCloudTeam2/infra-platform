---
- name: Configure HAProxy edge nodes
  hosts: haproxy
  become: true

  pre_tasks:
    - name: Validate onprem_edge_backends is provided
      ansible.builtin.assert:
        that:
          - onprem_edge_backends is defined
          - onprem_edge_backends | length >= 1
        fail_msg: "onprem_edge_backends 값을 inventory에서 설정해야 함"

  tasks:
    - name: Install haproxy
      ansible.builtin.package:
        name: haproxy
        state: present

    - name: Deploy haproxy config
      ansible.builtin.template:
        src: ../templates/haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: "0644"
        validate: "/usr/sbin/haproxy -c -f %s"
      notify: restart haproxy

    - name: Ensure haproxy enabled
      ansible.builtin.service:
        name: haproxy
        enabled: true
        state: started

  handlers:
    - name: restart haproxy
      ansible.builtin.service:
        name: haproxy
        state: restarted
