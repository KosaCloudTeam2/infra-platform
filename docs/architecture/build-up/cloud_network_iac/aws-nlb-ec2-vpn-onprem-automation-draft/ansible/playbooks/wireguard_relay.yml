---
- name: Configure WireGuard relay on AWS
  hosts: relay
  become: true

  pre_tasks:
    - name: Validate required WireGuard vars
      ansible.builtin.assert:
        that:
          - onprem_public_key is defined
          - relay_private_key is defined
          - onprem_cidr is defined
          - onprem_public_key != 'REPLACE_ONPREM_PUBLIC_KEY'
          - relay_private_key != 'REPLACE_RELAY_PRIVATE_KEY'
        fail_msg:
          "onprem_public_key / relay_private_key / onprem_cidr 값을 inventory 또는 extra-vars로
          설정해야 함"

    - name: Build effective allowed IPs
      ansible.builtin.set_fact:
        onprem_allowed_ips_effective:
          "{{ onprem_allowed_ips | default('10.200.0.2/32,' ~ onprem_cidr) }}"

  tasks:
    - name: Install wireguard packages
      ansible.builtin.package:
        name: wireguard-tools
        state: present

    - name: Create wireguard directory
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Enable IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: true

    - name: Deploy wireguard config
      ansible.builtin.template:
        src: ../templates/wg0.conf.j2
        dest: /etc/wireguard/{{ wg_interface | default('wg0') }}.conf
        owner: root
        group: root
        mode: "0600"
      notify: restart wireguard

    - name: Ensure wireguard service enabled
      ansible.builtin.service:
        name: wg-quick@{{ wg_interface | default('wg0') }}
        enabled: true
        state: started

  handlers:
    - name: restart wireguard
      ansible.builtin.service:
        name: wg-quick@{{ wg_interface | default('wg0') }}
        state: restarted
