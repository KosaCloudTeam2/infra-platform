name: Refresh AWS Burst ASG

on:
  workflow_dispatch:
    inputs:
      asg_name:
        description: "Auto Scaling Group name. Defaults to cloud-infra-dev-burst-app-asg."
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  DEFAULT_ASG_NAME: cloud-infra-dev-burst-app-asg

jobs:
  refresh-asg:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start instance refresh
        shell: bash
        run: |
          asg_name="${{ inputs.asg_name }}"
          if [ -z "$asg_name" ]; then
            asg_name="$DEFAULT_ASG_NAME"
          fi

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$asg_name" \
            --preferences MinHealthyPercentage=50,InstanceWarmup=300

      - name: Show target health hint
        shell: bash
        run: |
          echo "Instance refresh started. Check ALB Target Group health and CloudWatch alarms before demo."
