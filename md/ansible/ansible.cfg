###############################################################################
# ansible.cfg
# 프로젝트 단위 Ansible 설정 — 이 디렉토리에서 ansible-playbook 실행 시 자동 적용
###############################################################################

[defaults]
# 인벤토리 기본 경로
inventory = inventory/hosts.yml

# Python 모듈 캐시 (속도 향상)
fact_caching         = jsonfile
fact_caching_connection = .ansible_facts
fact_caching_timeout = 86400

# 호스트 키 자동 수락 (사내망 + 새 VM 많이 만들어서)
# 운영 단계에선 false 권장
host_key_checking = False

# SSH 키 파일 (cloud-init에 주입한 키와 일치해야 함)
private_key_file = ~/.ssh/kosa_iac

# 출력 보기 좋게
stdout_callback   = yaml
callbacks_enabled = profile_tasks, timer

# 동시 실행 수
forks = 10

# Role 검색 경로
roles_path = roles

# 멱등성 깨지는 변경에 경고
deprecation_warnings = True

[ssh_connection]
# SSH 연결 최적화
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

[privilege_escalation]
# sudo 사용 (ubuntu 사용자는 기본 NOPASSWD sudoer)
become         = True
become_method  = sudo
become_user    = root
become_ask_pass = False
