###############################################################################
# group_vars/all.yml
# 모든 호스트에 적용되는 공통 변수
###############################################################################

# Timezone
timezone: Asia/Seoul

# 한국어 로케일 (선택)
locale: en_US.UTF-8

# 모든 노드에 만들 운영용 사용자 (cloud-init의 ubuntu와 별개)
# 운영 단계엔 admin 계정 분리 권장. 일단은 ubuntu만 사용해도 됨.
ops_users:
  - name: ubuntu
    groups: [sudo, docker]
    shell: /bin/bash

# K8s 버전 (kubeadm/kubelet/kubectl 모두 동일하게)
kubernetes_version: "1.30"   # MAJOR.MINOR (패치는 apt가 자동)

# containerd 버전 (Ubuntu 22.04 기본 repo 사용 시 굳이 명시 X)
# Docker repo 사용 시: containerd_version: "1.7.*"

# Pod / Service 네트워크 CIDR (CNI/MetalLB와 맞춰야 함)
pod_subnet:     "10.244.0.0/16"   # Cilium 기본값과 호환
service_subnet: "10.96.0.0/12"    # K8s 기본값

# 클러스터 API 엔드포인트
# - HAProxy/keepalived VIP 또는 첫 CP IP
# - 단일 CP IP를 쓰면 그 노드 다운 시 클러스터 관리 어려움
# - 가능하면 pfSense에 VIP 만들어서 사용
kubernetes_api_endpoint: "172.16.23.10"   # k8s-cp1 IP (임시)
kubernetes_api_port: 6443

# 클러스터 이름
cluster_name: kosa-k8s

# CNI 선택: calico (Tigera Operator 방식)
# - 표준 NetworkPolicy 지원
# - PII 분리 차단 룰 작성에 사용
cni_plugin: calico
calico_version: "v3.27.0"

# Pod 네트워크 CIDR (Calico ipPool과 일치해야 함)
# pod_subnet: "10.244.0.0/16"  # 위에 이미 정의되어 있음
