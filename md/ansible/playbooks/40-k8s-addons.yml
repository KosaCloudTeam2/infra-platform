---
###############################################################################
# 40-k8s-addons.yml
#
# K8s 클러스터에 필수 애드온 설치.
# - Calico CNI (Pod 네트워킹 + NetworkPolicy)
# - MetalLB (LoadBalancer 타입 서비스)
# - Metrics Server (HPA용)
#
# 실행 위치: primary_control_plane (k8s-cp1)
# - 이 노드에서 kubectl이 작동하므로 모든 K8s 리소스 적용은 여기서
###############################################################################

- name: Install K8s cluster addons
  hosts: "{{ primary_control_plane }}"
  become: false # ubuntu 사용자로 (kubectl이 그 사용자의 ~/.kube/config 사용)

  environment:
    KUBECONFIG: /home/ubuntu/.kube/config

  tasks:
    #########################################################################
    # 1) Helm 설치 (애드온 설치에 필요)
    #########################################################################
    - name: Helm 설치 여부 확인
      ansible.builtin.command: helm version --short
      register: helm_check
      failed_when: false
      changed_when: false

    - name: Helm 설치
      ansible.builtin.shell: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      become: true
      when: helm_check.rc != 0

    #########################################################################
    # 2) Calico CNI 설치 (Tigera Operator 방식)
    #
    # Calico는 두 가지 설치 방법:
    #   A. Manifest 방식 (단일 YAML)
    #   B. Operator 방식 (이게 권장 - Day-2 운영 편함)
    #
    # 여기선 Operator 방식 사용.
    #########################################################################
    - name: Tigera Operator 설치 (Calico 관리 도구)
      kubernetes.core.k8s:
        state: present
        src: https://raw.githubusercontent.com/projectcalico/calico/v3.27.0/manifests/tigera-operator.yaml

    - name: Operator 준비 대기 (30초)
      ansible.builtin.pause:
        seconds: 30

    - name: Calico Installation 리소스 적용
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operator.tigera.io/v1
          kind: Installation
          metadata:
            name: default
          spec:
            # Pod 네트워크 CIDR
            calicoNetwork:
              ipPools:
                - blockSize: 26
                  cidr: "{{ pod_subnet }}" # group_vars/all.yml: 10.244.0.0/16
                  encapsulation: VXLAN # IPIP보다 호환성 좋음
                  natOutgoing: Enabled
                  nodeSelector: all()

    - name: APIServer 리소스 적용 (Calico API 서버 활성화)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operator.tigera.io/v1
          kind: APIServer
          metadata:
            name: default

    - name: Calico 노드 모두 Running 될 때까지 대기 (최대 5분)
      ansible.builtin.command: >
        kubectl wait --for=condition=Ready pods -n calico-system
        -l k8s-app=calico-node --timeout=300s
      changed_when: false

    #########################################################################
    # 3) Metrics Server 설치 (HPA용)
    #
    # kubectl top, HPA 자동 스케일링 위해 필수.
    # Pod의 CPU/Memory 메트릭을 K8s API로 노출.
    #########################################################################
    - name: Metrics Server manifest 적용
      kubernetes.core.k8s:
        state: present
        src: https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

    # 자체 서명 인증서 환경에선 --kubelet-insecure-tls 옵션 필요
    - name: Metrics Server에 --kubelet-insecure-tls 옵션 추가 (자체서명 환경)
      kubernetes.core.k8s_json_patch:
        kind: Deployment
        namespace: kube-system
        name: metrics-server
        patch:
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: "--kubelet-insecure-tls"

    - name: Metrics Server 준비 대기
      ansible.builtin.command: >
        kubectl wait --for=condition=Available deployment/metrics-server
        -n kube-system --timeout=180s
      changed_when: false

    #########################################################################
    # 4) MetalLB 설치 (LoadBalancer 서비스 IP 부여)
    #
    # 온프레 K8s엔 클라우드 LB가 없어서 LoadBalancer 타입 서비스가 Pending됨.
    # MetalLB가 사내 네트워크에서 IP를 할당해줌 (Layer 2 또는 BGP 모드).
    #########################################################################
    - name: MetalLB namespace 생성 (privileged label 필요)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: metallb-system
            labels:
              # MetalLB는 privileged 권한 필요 (kernel-level network 조작)
              pod-security.kubernetes.io/enforce: privileged

    - name: MetalLB Helm repo 추가
      kubernetes.core.helm_repository:
        name: metallb
        repo_url: https://metallb.github.io/metallb

    - name: MetalLB 설치
      kubernetes.core.helm:
        name: metallb
        chart_ref: metallb/metallb
        release_namespace: metallb-system
        chart_version: "0.14.0"
        wait: true

    - name: MetalLB IPAddressPool 설정 (VLAN 20 DMZ 대역에서 일부 할당)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: kosa-pool
            namespace: metallb-system
          spec:
            addresses:
              # 172.16.22.50 ~ 172.16.22.100 범위 사용
              # 게이트웨이(.1)와 충돌하지 않게
              - 172.16.22.50-172.16.22.100

    - name: MetalLB L2Advertisement 설정 (ARP 응답으로 IP 알림)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: kosa-l2adv
            namespace: metallb-system
          spec:
            ipAddressPools:
              - kosa-pool

    #########################################################################
    # 5) 최종 검증
    #########################################################################
    - name: 노드 상태 확인
      ansible.builtin.command: kubectl get nodes -o wide
      register: nodes_status
      changed_when: false

    - name: 노드 상태 출력
      ansible.builtin.debug:
        msg: "{{ nodes_status.stdout_lines }}"

    - name: 모든 시스템 파드 Running 확인
      ansible.builtin.command: kubectl get pods -A
      register: pods_status
      changed_when: false

    - name: 파드 상태 출력
      ansible.builtin.debug:
        msg: "{{ pods_status.stdout_lines }}"
