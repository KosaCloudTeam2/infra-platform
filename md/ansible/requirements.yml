---
###############################################################################
# requirements.yml
# Ansible collections — kubernetes.core, community.general 등
#
# 설치:
#   ansible-galaxy collection install -r requirements.yml
###############################################################################

collections:
  # K8s 모듈 (kubernetes.core.k8s, kubernetes.core.helm 등)
  - name: kubernetes.core
    version: ">=3.0.0"

  # community.general.timezone 등
  - name: community.general
    version: ">=8.0.0"

  # ansible.posix.firewalld 등 (RHEL 계열 호환)
  - name: ansible.posix
    version: ">=1.5.0"
