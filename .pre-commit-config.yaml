default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: "Gitleaks (Secret Scanning)"
        stages: [pre-commit, pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
        stages: [pre-commit, pre-push]
      - id: check-added-large-files
        args: ["--maxkb=2048"]
        stages: [pre-commit, pre-push]
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: "Prettier (Markdown/YAML/JSON/JS)"
        types_or: [markdown, yaml, json, javascript]
        exclude: |
          (?x)^(
            pnpm-lock\.yaml|
            package-lock\.json|
            uv\.lock|
            \.github/task-definition\.json
          )$
        additional_dependencies:
          - prettier@3.7.4

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: "ShellCheck"
        files: \.sh$

  - repo: local
    hooks:
      - id: ruff-format
        name: "Python format: ruff format"
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]

      - id: ruff-check
        name: "Python lint: ruff check"
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]

      - id: terraform-fmt
        name: "Terraform fmt"
        entry: terraform fmt -check -recursive
        language: system
        files: ^infra/terraform/.*\.tf$
        pass_filenames: false

      - id: pnpm-audit
        name: "SCA Security: pnpm audit"
        entry: pnpm audit
        language: system
        files: pnpm-lock.yaml
        pass_filenames: false
        stages: [pre-push, manual]

      - id: pip-audit
        name: "SCA Security: pip-audit"
        entry: uv run pip-audit --local --cache-dir .audit_cache
        language: system
        files: ^uv\.lock$
        pass_filenames: false
        stages: [pre-push, manual]
