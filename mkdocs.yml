site_name: Cloud Infra Deployment Platform (Demo)
site_description: 13+3 day cost-first hybrid cloud infrastructure project documentation
repo_name: infra-platform
docs_dir: docs
use_directory_urls: true
exclude_docs: |
  engineering/**
  operations/**
  architecture/build-up/cloud_network_iac/aws-nlb-ec2-vpn-onprem-automation-draft/terraform/**
  architecture/build-up/cloud_network_iac/aws-nlb-ec2-vpn-onprem-automation-draft/ansible/**
  architecture/build-up/cloud_network_iac/eks-cloud-bursting-with-karpenter-terraform-draft/terraform/**
not_in_nav: |
  daily_notice/[0-9]*.md

theme:
  name: material
  language: ko
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Core Guides:
      - Cleanup Plan: 01_cleanup_plan.md
      - Commit Strategy: 02_commit_strategy.md
      - MkDocs Guide: 03_mkdocs_guide.md
  - Team Operations:
      - Environment Setup: ENVIRONMENT_SETUP.md
      - Daily Notice: daily_notice/README.md
  - Reference:
      - Glossary: 04_glossary.md
      - Change Log: change_log.md
  - Architecture Build-up:
      - Guide: architecture/build-up/README.md
      - Cloud / Network / IaC:
          - Index: architecture/build-up/cloud_network_iac/README.md
          - AWS Hybrid Terraform Guide: architecture/build-up/cloud_network_iac/aws-hybrid-terraform-guide.md
          - AWS Hybrid Value Map: architecture/build-up/cloud_network_iac/aws-hybrid-value-map.md
          - AWS Hybrid Terraform README: architecture/build-up/cloud_network_iac/aws-hybrid-terraform/README.md
          - Thanos Ceph RGW Guide: architecture/build-up/cloud_network_iac/thanos-ceph-rgw-guide.md
          - AWS Cleanup Checklist: architecture/build-up/cloud_network_iac/aws-resource-cleanup-checklist.md
      - DB / Storage: architecture/build-up/db_storage/README.md
      - CI/CD / App Runtime: architecture/build-up/cicd_app_runtime/README.md
      - Observability / Integration: architecture/build-up/observability_integration/README.md
  - Runbooks:
      - Rollback: runbooks/rollback.md
      - Monitoring: runbooks/monitoring.md
      - Backup / Restore: runbooks/backup-restore.md
      - etcd Backup / Restore: runbooks/etcd-backup-restore.md
      - PXC Backup / Restore: runbooks/pxc-backup-restore.md
      - Harbor Metadata Backup / Restore: runbooks/harbor-metadata-backup-restore.md
      - Incident Scenarios: runbooks/incident_scenarios.md
  - Validation:
      - Overview: validation/README.md
      - Ceph Storage: validation/ceph-storage.md
  - Presentation:
      - Outline: presentation/outline.md
      - Storage Platform A to Z: presentation/storage-platform-a-to-z.md
      - Storage Platform Evidence: presentation/storage-platform-presentation-evidence.md
      - Storage Platform Evidence Verification: presentation/storage-platform-evidence-verification-guide.md
      - Storage Platform Slides: presentation/storage-platform-slides.md
      - Storage Platform Real Slides: presentation/storage-platform-real-slides.md
      - Storage Platform Real Speaker Notes: presentation/storage-platform-real-speaker-notes.md
      - Slides: presentation/presentation.md
      - Demo Script: presentation/demo_script.md
      - Q&A: presentation/qna.md
  - Decisions:
      - Summary: architecture/decisions/README.md
      - DR Template: architecture/decisions/DR-TEMPLATE.md
      - DR-01 k6 vs jmeter: architecture/decisions/DR-01-k6-vs-jmeter.md
  - Project Info:
      - Security Policy: project_info/05_security_policy.md
      - Definition of Done: project_info/07_definition_of_done.md
      - Risk Register: project_info/08_risk_register.md
      - GitHub Setup: project_info/11_github_setup.md
      - Quality Checks: project_info/18_quality_checks.md
      - Team Decision Checklist: project_info/21_team_decision_checklist.md
  - Troubleshooting:
