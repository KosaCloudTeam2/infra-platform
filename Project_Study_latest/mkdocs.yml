site_name: Cloud Infra Platform Study Docs
site_description: 클라우드 인프라 플랫폼 학습용 문서 사이트
docs_dir: .
site_dir: ../site-project-study-latest
use_directory_urls: true

theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - 문서 인벤토리: inventory.md
  - 학습 목차: toc-learning.md
  - Bastion 개념: Why_Bastion.md
  - Study:
      - 01. 프로젝트 개요: study/01-project-overview.md
      - 02. Proxmox Cloud-Init: study/02-proxmox-cloudinit.md
      - 03. pfSense Network: study/03-pfsense-network.md
      - 04. Kubernetes Core: study/04-kubernetes-core.md
      - 05. Calico CNI: study/05-calico-cni.md
      - 06. MetalLB Cert-Manager: study/06-metallb-certmanager.md
      - 07. Ceph Concept: study/07-ceph-concept.md
      - 08. Ceph CSI: study/08-ceph-csi.md
      - 09. Percona PXC: study/09-percona-pxc.md
      - 10. Redis Sentinel: study/10-redis-sentinel.md
      - 11. Prometheus Grafana: study/11-prometheus-grafana.md
      - 12. Helm ArgoCD: study/12-helm-argocd.md
      - 13. HPA k6: study/13-hpa-k6.md
      - 14. Terraform Ansible: study/14-terraform-ansible.md
      - 15. Ticket App: study/15-ticket-app.md
