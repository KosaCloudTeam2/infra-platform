[project]
name = "cloud-infra-platform"
version = "0.1.0"
description = "Team cloud infrastructure deployment platform"
requires-python = ">=3.11"
dependencies = [
    "urllib3==2.7.0",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1,<2.0",
    "mkdocs-material>=9.6.0",
    "pip-audit>=2.10.0",
    "pymdown-extensions>=10.14",
    "pre-commit>=4.3.0",
    "ruff>=0.14.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []
