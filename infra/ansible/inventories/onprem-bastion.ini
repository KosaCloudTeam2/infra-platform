[bastion]
bastion ansible_connection=local ansible_host=172.16.24.10

[k8s_control_plane]
k8s-cp1 ansible_host=172.16.23.10 proxmox_node=kosa4 vmid=210
k8s-cp2 ansible_host=172.16.23.11 proxmox_node=kosa2 vmid=211
k8s-cp3 ansible_host=172.16.23.12 proxmox_node=kosa3 vmid=212

[k8s_workers]
k8s-w1 ansible_host=172.16.23.20 proxmox_node=kosa3 vmid=220
k8s-w2 ansible_host=172.16.23.21 proxmox_node=kosa4 vmid=221
k8s-w3 ansible_host=172.16.23.22 proxmox_node=kosa2 vmid=222
k8s-sys1 ansible_host=172.16.23.23 proxmox_node=kosa1 vmid=223

[edge]
edge-haproxy ansible_host=172.16.22.10 proxmox_node=kosa4 vmid=250
edge-haproxy2 ansible_host=172.16.22.11 proxmox_node=kosa3 vmid=251

[k8s_nodes:children]
k8s_control_plane
k8s_workers

[onprem:children]
bastion
k8s_nodes
edge

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/kosa_iac
ansible_python_interpreter=/usr/bin/python3
